producer {
  # Dossier contenant vos images/datasets
  source.dir = "data/source"

  # Dossier où le producer va renommer les fichiers de staging pour etre utiliser par le Consumer
  destination.dir = "data/destination"

  # Dossier ou le produceur va deposer une copie complète, dossier INVISIBLE pour le Consumer
  staging.dir = "data/staging"

  # Nombre de fichiers à envoyer en même temps (batch)
  batch-size = 2

  # Temps d'attente entre chaque envoi (format HOCON)
  interval = "5 seconds"

  # Mode de transfert :
  # - "copy" : le fichier source est COPIÉ (l'original reste, rejouable)
  # - "move" : le fichier source est DÉPLACÉ (consommé une fois)
  mode = "copy"

  # Si true : explore les sous-dossiers de "source"
  # Si false : ne prend que les fichiers à la racine
  recursive = true

  # Si true : une fois tous les fichiers envoyés, on recommence depuis le début
  loop = true


}